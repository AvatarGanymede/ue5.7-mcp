name: Package and publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish a new plugin version
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Identify the plugin version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $descriptor = Get-Content -LiteralPath 'UnrealMCP/UnrealMCP.uplugin' -Raw | ConvertFrom-Json
          $version = [string]$descriptor.VersionName
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "UnrealMCP.uplugin VersionName must use MAJOR.MINOR.PATCH: $version"
          }

          $tag = "v$version"
          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          $refInfo = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '[.object.type, .object.sha] | @tsv' 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $PSNativeCommandUseErrorActionPreference = $previousNativePreference

          if ($tagExists) {
            $refParts = ([string]$refInfo).Trim() -split "`t", 2
            if ($refParts.Count -ne 2) {
              throw "Unexpected Git ref response for $tag"
            }
            $tagType = $refParts[0]
            $tagTarget = $refParts[1]
            if ($tagType -eq 'tag') {
              $tagTarget = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagTarget" --jq '.object.sha'
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to resolve annotated tag $tag"
              }
              $tagTarget = ([string]$tagTarget).Trim()
            }

            if (-not $tagTarget.Equals($env:GITHUB_SHA, [System.StringComparison]::OrdinalIgnoreCase)) {
              Write-Host "Version $version is already represented by $tag at commit $tagTarget; nothing to publish."
              'should_release=false' | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
              exit 0
            }
          }

          $requiredBinaries = @(
            'UnrealMCP/Binaries/Win64/UnrealEditor-UnrealMCP.dll',
            'UnrealMCP/Binaries/Win64/UnrealEditor.modules'
          )
          foreach ($path in $requiredBinaries) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "The release commit is missing prebuilt binary: $path"
            }
          }

          $zipName = "UnrealMCP-$version-UE5.7-Win64-GitHub.zip"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "artifacts/$zipName"
          'should_release=true' | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "tag=$tag" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "tag_exists=$($tagExists.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "zip_path=$zipPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Package prebuilt plugin
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        run: |
          ./scripts/package-prebuilt-github-release.ps1 -OutputFile '${{ steps.release.outputs.zip_path }}'

      - name: Upload workflow artifact
        if: steps.release.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: github-release-${{ steps.release.outputs.tag }}-${{ github.run_id }}
          path: artifacts/*-GitHub.zip
          if-no-files-found: error

      - name: Create tag and publish GitHub Release
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ZIP: ${{ steps.release.outputs.zip_path }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
        run: |
          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $previousNativePreference

          if ($releaseExists) {
            Write-Host "Release $env:RELEASE_TAG already exists; uploading the packaged asset."
            gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --title $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update the title for release $env:RELEASE_TAG"
            }
            gh release upload $env:RELEASE_TAG $env:RELEASE_ZIP `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          }
          elseif ($env:TAG_EXISTS -eq 'true') {
            gh release create $env:RELEASE_TAG $env:RELEASE_ZIP `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --generate-notes `
              --title $env:RELEASE_TAG
          }
          else {
            gh release create $env:RELEASE_TAG $env:RELEASE_ZIP `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --generate-notes `
              --title $env:RELEASE_TAG
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish $env:RELEASE_ZIP to release $env:RELEASE_TAG"
          }
